name: Apply collaboration review fixes

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: collaboration-review-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/stable-list-collaboration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Setup
        uses: ./tooling/github/setup

      - name: Apply reviewed backend patch
        run: |
          set -euo pipefail
          python scripts/apply-collaboration-review-fixes.py
          pnpm --filter @karakeep/trpc format:fix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/trpc/models/lists.ts packages/trpc/routers/lists.ts
          git commit --no-verify -m "fix: reconcile recursive collaboration state"
          git push origin HEAD:${{ github.head_ref }}
