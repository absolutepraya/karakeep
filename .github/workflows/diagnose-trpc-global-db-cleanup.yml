name: Diagnose TRPC global DB cleanup

on:
  push:
    branches:
      - fix/public-list-experience

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Add module database cleanup candidate
        run: |
          cat > packages/trpc/vitest.setup.ts <<'EOF'
          import { afterAll } from "vitest";

          import { db } from "@karakeep/db/drizzle";

          afterAll(() => {
            if (db.$client.open) {
              db.$client.close();
            }
          });
          EOF

          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/trpc/vitest.config.ts")
          text = path.read_text()
          text = text.replace(
              '  test: {\n    poolOptions:',
              '  test: {\n    setupFiles: ["./vitest.setup.ts"],\n    poolOptions:',
          )
          path.write_text(text)
          PY

          pnpm exec oxfmt packages/trpc/vitest.config.ts packages/trpc/vitest.setup.ts
          git diff --check
          cat packages/trpc/vitest.config.ts
          cat packages/trpc/vitest.setup.ts

      - name: Run TRPC suite first pass
        working-directory: packages/trpc
        run: pnpm test

      - name: Run TRPC suite second pass
        working-directory: packages/trpc
        run: pnpm test

      - name: Typecheck TRPC
        working-directory: packages/trpc
        run: pnpm typecheck
