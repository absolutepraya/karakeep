name: PR39 final review fixes

on:
  push:
    branches:
      - feat/stable-list-collaboration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stable-list-collaboration
          fetch-depth: 0
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          access_path = "packages/trpc/models/listCollaborationAccess.ts"
          marker = '''export async function getEffectiveCollaboratorsForList(\n  ctx: AuthedContext,\n  list: AccessibleListData,\n) {'''
          helper = '''export async function getEffectiveListAccessUserIds(\n  ctx: AuthedContext,\n  ownerId: string,\n  targetListIds: string[],\n): Promise<Map<string, Set<string>>> {\n  const result = new Map(\n    targetListIds.map((listId) => [listId, new Set([ownerId])]),\n  );\n  if (targetListIds.length === 0) {\n    return result;\n  }\n\n  const ownerLists = await ctx.db.query.bookmarkLists.findMany({\n    columns: {\n      id: true,\n      name: true,\n      userId: true,\n      parentId: true,\n      type: true,\n    },\n    where: eq(bookmarkLists.userId, ownerId),\n  });\n  if (ownerLists.length === 0) {\n    return result;\n  }\n\n  const ownerListIds = ownerLists.map((list) => list.id);\n  const memberships = await ctx.db.query.listCollaborators.findMany({\n    where: inArray(listCollaborators.listId, ownerListIds),\n  });\n  if (memberships.length === 0) {\n    return result;\n  }\n\n  const collaboratorUserIds = [\n    ...new Set(memberships.map((membership) => membership.userId)),\n  ];\n  const scopes = await ctx.db.query.listCollaborationScopes.findMany({\n    where: and(\n      inArray(listCollaborationScopes.listId, ownerListIds),\n      inArray(listCollaborationScopes.userId, collaboratorUserIds),\n    ),\n  });\n\n  const listById = new Map(ownerLists.map((list) => [list.id, list]));\n  const membershipsByList = new Map<string, typeof memberships>();\n  for (const membership of memberships) {\n    const entries = membershipsByList.get(membership.listId) ?? [];\n    entries.push(membership);\n    membershipsByList.set(membership.listId, entries);\n  }\n  const scopeByKey = new Map(\n    scopes.map((scope) => [`${scope.listId}:${scope.userId}`, scope.recursive]),\n  );\n\n  for (const targetListId of targetListIds) {\n    const target = listById.get(targetListId);\n    if (!target || target.type !== "manual") {\n      continue;\n    }\n\n    const accessUserIds = result.get(targetListId)!;\n    const resolvedCollaborators = new Set<string>();\n    let current: AccessibleListData | undefined = target;\n    let depth = 0;\n    const visited = new Set<string>();\n\n    while (current && !visited.has(current.id)) {\n      visited.add(current.id);\n      for (const membership of membershipsByList.get(current.id) ?? []) {\n        if (resolvedCollaborators.has(membership.userId)) {\n          continue;\n        }\n        const recursive =\n          scopeByKey.get(`${current.id}:${membership.userId}`) ?? false;\n        if (depth === 0 || recursive) {\n          accessUserIds.add(membership.userId);\n          resolvedCollaborators.add(membership.userId);\n        }\n      }\n\n      if (!current.parentId) {\n        break;\n      }\n      current = listById.get(current.parentId);\n      depth += 1;\n    }\n  }\n\n  return result;\n}\n\nexport async function getEffectiveCollaboratorsForList(\n  ctx: AuthedContext,\n  list: AccessibleListData,\n) {'''
          replace_once(access_path, marker, helper)

          router_path = "packages/trpc/routers/lists.ts"
          replace_once(
              router_path,
              '''import { experimental_trpcMiddleware } from "@trpc/server";''',
              '''import { experimental_trpcMiddleware, TRPCError } from "@trpc/server";''',
          )
          replace_once(
              router_path,
              '''  getEffectiveCollaboratorGrant,\n  getEffectiveCollaboratorGrantsForOwner,\n  getEffectiveCollaboratorsForList,''',
              '''  getEffectiveCollaboratorGrant,\n  getEffectiveCollaboratorGrantsForOwner,\n  getEffectiveCollaboratorsForList,\n  getEffectiveListAccessUserIds,''',
          )
          replace_once(
              router_path,
              '''async function listAccessSnapshot(\n  ctx: AuthedContext,\n  listIds: string[],\n  ownerId: string,\n) {\n  const result = new Map<string, Set<string>>();\n  for (const listId of listIds) {\n    result.set(listId, new Set(await listSyncUserIds(ctx, listId, ownerId)));\n  }\n  return result;\n}''',
              '''async function listAccessSnapshot(\n  ctx: AuthedContext,\n  listIds: string[],\n  ownerId: string,\n) {\n  return getEffectiveListAccessUserIds(ctx, ownerId, listIds);\n}''',
          )
          replace_once(
              router_path,
              '''        if (!rawList) {\n          throw new Error("Expected list to exist while leaving collaboration");\n        }''',
              '''        if (!rawList) {\n          throw new TRPCError({ code: "NOT_FOUND", message: "List not found" });\n        }''',
          )
          replace_once(
              router_path,
              '''        if (!grant) {\n          throw new Error("Expected an effective collaboration grant");\n        }''',
              '''        if (!grant) {\n          throw new TRPCError({\n            code: "NOT_FOUND",\n            message: "Collaborator not found",\n          });\n        }''',
          )

          Path(".github/workflows/pr39-final-review-fixes.yml").unlink()
          PY
      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix: batch collaboration access snapshots"
          git push origin HEAD:feat/stable-list-collaboration
