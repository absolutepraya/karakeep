name: PR39 final formatter

on:
  push:
    branches:
      - feat/stable-list-collaboration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stable-list-collaboration
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm format:fix
          rm .github/workflows/pr39-format-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "style: format final collaboration fixes"
          git push origin HEAD:feat/stable-list-collaboration
