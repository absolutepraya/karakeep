name: Build and Push image

# Pull-based deploy: this workflow only builds + pushes the AIO image to GHCR.
# The VPS runs a Watchtower container that polls GHCR and redeploys when :main
# changes, so no inbound SSH / deploy step is needed here (the VPS firewalls SSH
# to Tailscale only). See deploy/docker-compose.prod.yml.

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-and-push-main
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: |
          set -euo pipefail
          image_name="ghcr.io/${{ github.repository_owner }}/karakeep"
          short_sha="$(git rev-parse --short=12 HEAD)"
          {
            echo "image_name=${image_name}"
            echo "image_ref=${image_name}:main"
            echo "sha_tag=sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push AIO image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: docker/Dockerfile
          target: aio
          # Single-arch: the VPS is amd64 (Jetorbit). Building arm64 under QEMU
          # roughly doubles build time for an image that is never run.
          platforms: linux/amd64
          build-args: SERVER_VERSION=main
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
