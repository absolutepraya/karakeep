name: Finalize TRPC SQLite cleanup

on:
  push:
    branches:
      - fix/public-list-experience

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./tooling/github/setup

      - name: Apply verified per-test cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/trpc/testUtils.ts")
          text = path.read_text()
          text = text.replace(
              'import { vi } from "vitest";',
              'import type { TestContext } from "vitest";\nimport { vi } from "vitest";',
          )
          text = text.replace(
              'export async function buildTestContext(\n  seedDB: boolean,\n): Promise<CustomTestContext> {\n  const db = getTestDB();',
              'export async function buildTestContext(\n  seedDB: boolean,\n  context?: Pick<TestContext, "onTestFinished">,\n): Promise<CustomTestContext> {\n  const db = getTestDB();\n  context?.onTestFinished(() => {\n    db.$client.close();\n  });',
          )
          text = text.replace(
              'return async (context: object) => {',
              'return async (context: TestContext) => {',
          )
          text = text.replace(
              'Object.assign(context, await buildTestContext(seedDB));',
              'Object.assign(context, await buildTestContext(seedDB, context));',
          )
          path.write_text(text)

          path = Path("packages/trpc/routers/admin.test.ts")
          text = path.read_text().replace(
              'const testContext = await buildTestContext(true);',
              'const testContext = await buildTestContext(true, context);',
          )
          path.write_text(text)

          path = Path("packages/trpc/lib/__tests__/search.test.ts")
          text = path.read_text().replace(
              'beforeEach(async () => {\n  const db = getInMemoryDB(true);',
              'beforeEach(async (context) => {\n  const db = getInMemoryDB(true);\n  context.onTestFinished(() => {\n    db.$client.close();\n  });',
          )
          path.write_text(text)

          path = Path("packages/trpc/lib/__tests__/ruleEngine.test.ts")
          text = path.read_text().replace(
              'beforeEach(async () => {\n    vi.resetAllMocks();\n    db = getInMemoryDB(/* runMigrations */ true);',
              'beforeEach(async (context) => {\n    vi.resetAllMocks();\n    db = getInMemoryDB(/* runMigrations */ true);\n    context.onTestFinished(() => {\n      db.$client.close();\n    });',
          )
          path.write_text(text)
          PY

          pnpm exec oxfmt \
            packages/trpc/testUtils.ts \
            packages/trpc/routers/admin.test.ts \
            packages/trpc/lib/__tests__/search.test.ts \
            packages/trpc/lib/__tests__/ruleEngine.test.ts
          git diff --check

      - name: Verify cleanup behavior
        run: |
          cat > packages/trpc/testUtils.cleanup.test.ts <<'EOF'
          import { expect, test } from "vitest";

          import type { TestDB } from "./testUtils";
          import { buildTestContext } from "./testUtils";

          let previousDb: TestDB;

          test("opens an in-memory test database", async (context) => {
            previousDb = (await buildTestContext(false, context)).db;
            expect(previousDb.$client.open).toBe(true);
          });

          test("closes the database when the previous test finishes", () => {
            expect(previousDb.$client.open).toBe(false);
          });
          EOF
          cd packages/trpc
          pnpm exec vitest run testUtils.cleanup.test.ts
          rm testUtils.cleanup.test.ts

      - name: Verify full TRPC suite
        working-directory: packages/trpc
        run: pnpm test

      - name: Verify TRPC typecheck
        working-directory: packages/trpc
        run: pnpm typecheck

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regen-better-sqlite-lock.yml
          git add \
            packages/trpc/testUtils.ts \
            packages/trpc/routers/admin.test.ts \
            packages/trpc/lib/__tests__/search.test.ts \
            packages/trpc/lib/__tests__/ruleEngine.test.ts
          git commit -m "fix: close TRPC test databases"
          git push origin HEAD:fix/public-list-experience
