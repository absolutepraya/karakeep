name: Diagnose TRPC SQLite cleanup

on:
  push:
    branches:
      - fix/public-list-experience

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup
        uses: ./tooling/github/setup

      - name: Add cleanup regression test
        run: |
          cat > packages/trpc/testUtils.cleanup.test.ts <<'EOF'
          import { expect, test } from "vitest";

          import type { TestDB } from "./testUtils";
          import { getTestDB } from "./testUtils";

          let previousDb: TestDB;

          test("opens an in-memory test database", (context) => {
            previousDb = getTestDB(context);
            expect(previousDb.$client.open).toBe(true);
          });

          test("closes the database when the previous test finishes", () => {
            expect(previousDb.$client.open).toBe(false);
          });
          EOF

      - name: Verify regression test fails before fix
        working-directory: packages/trpc
        run: |
          if pnpm exec vitest run testUtils.cleanup.test.ts; then
            echo "Expected the cleanup regression test to fail before the fix"
            exit 1
          fi

      - name: Apply candidate per-test cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("packages/trpc/testUtils.ts")
          text = path.read_text()
          text = text.replace(
              'import { vi } from "vitest";',
              'import type { TestContext } from "vitest";\nimport { vi } from "vitest";',
          )
          text = text.replace(
              'export function getTestDB() {\n  return getInMemoryDB(true);\n}',
              '''export function getTestDB(\n  context: Pick<TestContext, "onTestFinished">,\n) {\n  const db = getInMemoryDB(true);\n  context.onTestFinished(() => {\n    db.$client.close();\n  });\n  return db;\n}''',
          )
          text = text.replace(
              'export async function buildTestContext(\n  seedDB: boolean,\n): Promise<CustomTestContext> {\n  const db = getTestDB();',
              'export async function buildTestContext(\n  seedDB: boolean,\n  context: Pick<TestContext, "onTestFinished">,\n): Promise<CustomTestContext> {\n  const db = getTestDB(context);',
          )
          text = text.replace(
              'return async (context: object) => {',
              'return async (context: TestContext) => {',
          )
          text = text.replace(
              'Object.assign(context, await buildTestContext(seedDB));',
              'Object.assign(context, await buildTestContext(seedDB, context));',
          )
          path.write_text(text)

          path = Path("packages/trpc/lib/__tests__/search.test.ts")
          text = path.read_text()
          text = text.replace(
              'import { getInMemoryDB } from "@karakeep/db/drizzle";\n',
              '',
          )
          text = text.replace(
              'import { AuthedContext } from "../..";\n',
              'import { AuthedContext } from "../..";\nimport { getTestDB } from "../../testUtils";\n',
          )
          text = text.replace(
              'beforeEach(async () => {\n  const db = getInMemoryDB(true);',
              'beforeEach(async (context) => {\n  const db = getTestDB(context);',
          )
          path.write_text(text)

          path = Path("packages/trpc/lib/__tests__/ruleEngine.test.ts")
          text = path.read_text()
          text = text.replace(
              'import { getInMemoryDB } from "@karakeep/db/drizzle";\n',
              '',
          )
          text = text.replace(
              'import { TestDB } from "../../testUtils";',
              'import { getTestDB, TestDB } from "../../testUtils";',
          )
          text = text.replace(
              'beforeEach(async () => {\n    vi.resetAllMocks();\n    db = getInMemoryDB(/* runMigrations */ true);',
              'beforeEach(async (context) => {\n    vi.resetAllMocks();\n    db = getTestDB(context);',
          )
          path.write_text(text)
          PY

          git diff --check

      - name: Verify cleanup regression test passes
        working-directory: packages/trpc
        run: pnpm exec vitest run testUtils.cleanup.test.ts

      - name: Verify full TRPC suite
        working-directory: packages/trpc
        run: pnpm test

      - name: Verify TRPC typecheck
        working-directory: packages/trpc
        run: pnpm typecheck
