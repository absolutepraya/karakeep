name: PWA Web Verification

on:
  pull_request:
    branches: ["*"]
    paths:
      - "apps/web/components/pwa/**"
      - "apps/web/components/shared/sidebar/SidebarVersion*"
      - "apps/web/components/dashboard/header/ProfileOptions*"
      - "apps/web/components/dashboard/header/Header*"
      - "apps/web/lib/i18n/**"
      - "apps/web/@types/i18next.d.ts"
      - "apps/web/lib/providers.tsx"
      - "apps/web/public/sw.js"
      - ".github/workflows/pwa-readiness-tdd.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-pwa-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup
        with:
          node-version: "22.21.1"

      - name: Focused PWA and profile regressions
        run: |
          pnpm --filter @karakeep/web test --run \
            components/pwa/ServiceWorkerRegistration.test.tsx \
            components/pwa/ServiceWorkerRegistration.timeout.test.tsx \
            components/pwa/ServiceWorkerRegistration.readiness.test.tsx \
            components/pwa/sw.test.ts \
            components/shared/sidebar/SidebarVersion.test.tsx \
            components/dashboard/header/ProfileOptions.test.tsx \
            components/dashboard/header/Header.test.tsx

      - name: Full web Vitest suite
        run: pnpm --filter @karakeep/web test --run
