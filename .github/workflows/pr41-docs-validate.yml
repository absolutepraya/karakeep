name: PR 41 docs validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    if: github.event.pull_request.number == 41
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Docs typecheck
        run: pnpm --filter @karakeep/docs typecheck

      - name: Docs build
        run: pnpm --filter @karakeep/docs build
