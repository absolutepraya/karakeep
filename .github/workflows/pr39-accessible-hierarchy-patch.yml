name: PR39 accessible hierarchy patch

on:
  push:
    branches:
      - feat/stable-list-collaboration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stable-list-collaboration
          fetch-depth: 0

      - name: Apply reviewed patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "packages/trpc/models/listCollaborationAccess.ts",
              '''  return result;\n}\n\nexport async function getEffectiveCollaboratorsForList(''',
              '''  const accessibleListIds = new Set(result.map(({ list }) => list.id));\n  return result.map(({ list, grant }) => ({\n    list: {\n      ...list,\n      parentId:\n        list.parentId && accessibleListIds.has(list.parentId)\n          ? list.parentId\n          : null,\n    },\n    grant,\n  }));\n}\n\nexport async function getEffectiveCollaboratorsForList(''',
          )

          replace_once(
              "packages/trpc/models/lists.ts",
              '''  asZBookmarkList() {\n    if (this.list.userId === this.ctx.user.id) {''',
              '''  asZBookmarkList(options?: { includeVisibleParent?: boolean }) {\n    if (this.list.userId === this.ctx.user.id) {''',
          )
          replace_once(
              "packages/trpc/models/lists.ts",
              '''      parentId: null,\n      public: false,''',
              '''      parentId: options?.includeVisibleParent ? this.list.parentId : null,\n      public: false,''',
          )

          replace_once(
              "packages/trpc/routers/lists.ts",
              '''    .query(async ({ ctx }) => {\n      const results = await List.getAll(ctx);\n      return { lists: results.map((l) => l.asZBookmarkList()) };\n    }),''',
              '''    .query(async ({ ctx }) => {\n      const results = await List.getAll(ctx);\n      return {\n        lists: results.map((l) =>\n          l.asZBookmarkList({ includeVisibleParent: true }),\n        ),\n      };\n    }),''',
          )

          replace_once(
              "packages/trpc/routers/lists.ts",
              '''        const list = await List.fromId(transactionCtx, input.listId);\n        const serialized = list.asZBookmarkList();\n        const grant = await getEffectiveCollaboratorGrant(\n          transactionCtx,\n          serialized,\n          ctx.user.id,\n        );\n        if (!grant) {\n          throw new Error("Expected an effective collaboration grant");\n        }''',
              '''        const list = await List.fromId(transactionCtx, input.listId);\n        const serialized = list.asZBookmarkList();\n        if (serialized.userRole === "owner") {\n          await list.leaveList();\n          return;\n        }\n        const rawList = await transactionCtx.db.query.bookmarkLists.findFirst({\n          columns: { rssToken: false },\n          where: eq(bookmarkLists.id, input.listId),\n        });\n        if (!rawList) {\n          throw new Error("Expected list to exist while leaving collaboration");\n        }\n        const grant = await getEffectiveCollaboratorGrant(\n          transactionCtx,\n          rawList,\n          ctx.user.id,\n        );\n        if (!grant) {\n          throw new Error("Expected an effective collaboration grant");\n        }''',
          )

          Path(".github/workflows/pr39-accessible-hierarchy-patch.yml").unlink()
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve accessible shared-list hierarchy"
          git push origin HEAD:feat/stable-list-collaboration
