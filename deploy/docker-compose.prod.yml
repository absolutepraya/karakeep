# Karakeep fork — staging/prod compose (pull-based deploy via Watchtower).
# Deploy model: GitHub Actions builds + pushes ghcr.io/absolutepraya/karakeep:main;
# the watchtower service below polls GHCR every 60s and redeploys `web` when the
# :main digest changes. The VPS never needs inbound SSH.
#
# Per-instance overrides go in a sibling .env file (auto-read by compose):
#   KARAKEEP_PORT  host port nginx proxies to (staging: 3100, prod: 3000)
#   NEXTAUTH_SECRET, MEILI_MASTER_KEY, NEXTAUTH_URL, DISABLE_SIGNUPS, ...
services:
  web:
    image: ${KARAKEEP_IMAGE:-ghcr.io/absolutepraya/karakeep:main}
    restart: unless-stopped
    depends_on:
      - chrome
      - meilisearch
    labels:
      # Only this container is auto-updated by watchtower (label-enable mode).
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - data:/data
    ports:
      # Bound to localhost only; nginx reverse-proxies the public subdomain to it.
      - 127.0.0.1:${KARAKEEP_PORT:-3000}:3000
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      DATA_DIR: /data

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

  watchtower:
    # Maintained fork; the original containrrr/watchtower is abandoned and its
    # Docker client (API 1.25) is too old for modern engines (min API 1.44).
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"

volumes:
  data:
  meilisearch:
