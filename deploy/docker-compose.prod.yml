# Karakeep fork — staging/prod compose (pull-based deploy via Watchtower).
# Deploy model: GitHub Actions builds version-compatible web and workers images;
# Watchtower polls GHCR every 60s and redeploys both Karakeep services when their
# :web-main and :workers-main digests change. The VPS never needs inbound SSH.
#
# Per-instance overrides go in a sibling .env file (auto-read by compose):
#   KARAKEEP_PORT  host port nginx proxies to (staging: 3100, prod: 3000)
#   NEXTAUTH_SECRET, MEILI_MASTER_KEY, NEXTAUTH_URL, DISABLE_SIGNUPS, ...
services:
  web:
    image: ${KARAKEEP_WEB_IMAGE:-ghcr.io/absolutepraya/karakeep:web-main}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      meilisearch:
        condition: service_started
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - data:/data
    ports:
      # Bound to localhost only; nginx reverse-proxies the public subdomain to it.
      - 127.0.0.1:${KARAKEEP_PORT:-3000}:3000
    env_file:
      - ${KARAKEEP_ENV_FILE:-.env}
    environment:
      MEILI_ADDR: http://meilisearch:7700
      DATA_DIR: /data

  workers:
    image: ${KARAKEEP_WORKERS_IMAGE:-ghcr.io/absolutepraya/karakeep:workers-main}
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      web:
        condition: service_healthy
      meilisearch:
        condition: service_started
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - data:/data
    env_file:
      - ${KARAKEEP_ENV_FILE:-.env}
      - ${KARAKEEP_WORKERS_ENV_FILE:-.workers.env}
    environment:
      DATA_DIR: /data
      MEILI_ADDR: http://meilisearch:7700
      WORKER_PROFILE: screenshot-first
      BROWSER_CONNECT_ONDEMAND: "true"
    networks:
      - default
      - renderer

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - ${KARAKEEP_ENV_FILE:-.env}
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

  watchtower:
    # Maintained fork; the original containrrr/watchtower is abandoned and its
    # Docker client (API 1.25) is too old for modern engines (min API 1.44).
    image: ghcr.io/nicholas-fedor/watchtower:latest
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"

volumes:
  data:
  meilisearch:

networks:
  renderer:
    external: true
    name: karakeep-renderer
