worktree_path = ".worktrees"
port_offset_interval = 100
max_slots = 9

# Worktrees isolate source and dependencies, but intentionally share the root
# development environment. start-dev.sh does not yet namespace its ports,
# containers, or DATA_DIR by WT_WORKSPACE_NAME. Run the local dev stack from
# only one worktree at a time.
setup = [
  "pnpm install --frozen-lockfile",
  "ln -sfn \"$WT_ROOT_PATH/.env\" .env",
  "ln -sfn ../../.env apps/web/.env",
  "ln -sfn ../../.env apps/workers/.env",
  "ln -sfn ../../.env packages/db/.env",
]
